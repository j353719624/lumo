name: golangci-lint
on:
  push:
    branches:
    - dev
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Test and build web assets
      run: make web-ci
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2
