<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUMO · 登录</title>
<style>
/* ============================================================
   LUMO · 登录
   与服务端控制台同一套主题，改主题只改 :root
   ============================================================ */
:root{
  --bg:#0B0E14; --panel:#131822; --panel-2:#0E1320; --panel-3:#101720;
  --line:#232C3C; --line-2:#171E29; --line-3:#2A3346;
  --tx:#E9EEF7; --tx-2:#8A97AC; --tx-3:#6C788E; --tx-4:#5D6A80; --tx-5:#4E5A70;
  --accent:#5A7BFF; --accent-soft:#AFC0FF; --teal:#35E0C8;
  --ok:#3DDC97; --warn:#FFB454; --bad:#FF5F73;
  --grad:linear-gradient(90deg,#5A7BFF 0%,#35E0C8 100%);
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:rgba(90,123,255,.35)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ============================================================
   骨架：左品牌 / 右表单
   ============================================================ */
.stage{
  display:grid;min-height:100vh;min-height:100dvh;
  grid-template-columns:minmax(0,1.06fr) minmax(420px,.94fr);
}

/* ---------------- 左：品牌侧 ---------------- */
.brandside{
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;gap:44px;
  padding:52px 56px;
  border-right:1px solid var(--line-2);
  background:
    radial-gradient(820px 560px at 6% 4%,rgba(90,123,255,.17),transparent 62%),
    radial-gradient(680px 520px at 88% 98%,rgba(53,224,200,.11),transparent 58%),
    var(--bg);
}
/* 极淡的网格，暗示「隧道/工程」而非装饰 */
.brandside::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(to right,rgba(255,255,255,.038) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(255,255,255,.038) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(118% 92% at 18% 12%,#000 0%,transparent 74%);
          mask-image:radial-gradient(118% 92% at 18% 12%,#000 0%,transparent 74%);
}
.deco{
  position:absolute;right:-150px;bottom:-200px;width:740px;height:740px;
  pointer-events:none;user-select:none;z-index:0;
}
.brandside > *{position:relative;z-index:1}
.brandside > .deco{position:absolute;z-index:0}

/* 品牌锁定组合 */
.lockup{display:flex;align-items:center;gap:12px}
.wordmark{font:700 15px/1 var(--sans);letter-spacing:2.6px}
.divider{width:1px;height:13px;background:#2F3A4D}
.cn{font-size:11.5px;letter-spacing:1.6px;color:var(--tx-3)}

/* 主张 */
.pitch h1{
  margin:0;font-size:38px;line-height:1.34;font-weight:700;letter-spacing:-.6px;
  text-wrap:balance;
}
.pitch h1 em{
  font-style:normal;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.pitch p{
  margin:16px 0 0;max-width:500px;
  font-size:13px;line-height:1.8;color:var(--tx-3);
}

/* 三条能力 */
.feats{display:flex;flex-direction:column;gap:15px;margin-top:34px}
.feat{display:flex;align-items:flex-start;gap:12px}
.feat .ic{
  width:28px;height:28px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;
  background:#151B26;border:1px solid var(--line);color:var(--accent-soft);
}
.feat b{display:block;font-size:12.5px;font-weight:600;margin-bottom:2px}
.feat span{font-size:11.5px;line-height:1.6;color:var(--tx-4)}

/* 页脚状态 */
.brandfoot{display:flex;align-items:center;gap:11px;flex-wrap:wrap;font-size:10.5px;color:var(--tx-5)}
.pill{
  height:24px;padding:0 9px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;
  background:#12281F;border:1px solid rgba(61,220,151,.3);color:var(--ok);font-size:10.5px;
}
.pill .dot{width:5px;height:5px;border-radius:3px;background:currentColor;
  box-shadow:0 0 8px 1px rgba(61,220,151,.6)}
.sep{width:1px;height:10px;background:#232C3C}

/* ---------------- 右：表单侧 ---------------- */
.formside{
  display:grid;place-items:center;padding:40px 32px;background:var(--bg);
}
.panel{
  width:100%;max-width:400px;padding:32px;
  background:var(--panel);border:1px solid var(--line);border-radius:20px;
  box-shadow:0 28px 70px -28px rgba(0,0,0,.85);
  animation:rise .4s cubic-bezier(.22,.68,.28,1) both;
}
/* 只做位移，不碰 opacity —— 动画未播放时也能正常显示 */
@keyframes rise{from{transform:translateY(9px)}to{transform:none}}

.panel h2{margin:0;font-size:21px;font-weight:700;letter-spacing:.4px;text-align:center}
.panel .sub{margin:7px 0 0;font-size:12px;color:var(--tx-3);letter-spacing:.6px;text-align:center}

/* 输入 */
.field{margin-top:18px}
.field label{display:block;font-size:11px;color:var(--tx-3);margin-bottom:7px}
.ctrl{position:relative;display:flex;align-items:center}
.ctrl .lead{position:absolute;left:12px;display:grid;place-items:center;color:var(--tx-5);pointer-events:none}
.ctrl input{
  width:100%;height:44px;padding:0 12px 0 38px;border-radius:10px;
  background:var(--panel-2);border:1px solid var(--line);
  font-size:13px;letter-spacing:.2px;outline:none;
  transition:border-color .16s,box-shadow .16s,background .16s;
}
.ctrl input::placeholder{color:#3E4859;letter-spacing:0}
.ctrl input:hover{border-color:#2F3A4D}
.ctrl input:focus{
  border-color:var(--accent);background:#0B1018;
  box-shadow:0 0 0 3px rgba(90,123,255,.16);
}
.ctrl.has-eye input{padding-right:44px}
.eye{
  position:absolute;right:5px;width:32px;height:32px;border-radius:8px;
  display:grid;place-items:center;color:var(--tx-5);
}
.eye:hover{background:#1B2130;color:var(--tx-2)}
.eye .off,.eye[aria-pressed="true"] .on{display:none}
.eye[aria-pressed="true"] .off{display:block}

/* 记住设备 / 忘记密码 */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.remember{position:relative;display:inline-flex;align-items:center;gap:8px;font-size:11.5px;color:var(--tx-3);cursor:pointer;user-select:none}
.remember input{position:absolute;opacity:0;width:0;height:0}
.sw{
  width:34px;height:19px;border-radius:10px;background:#232C3C;position:relative;
  flex:0 0 auto;transition:background .18s;
}
.sw::after{
  content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:8px;
  background:#7D8AA0;transition:transform .18s,background .18s;
}
.remember input:checked + .sw{background:var(--grad)}
.remember input:checked + .sw::after{transform:translateX(15px);background:#fff}
.link{font-size:11.5px;color:var(--accent-soft)}
.link:hover{color:#D6DEFF;text-decoration:underline;text-underline-offset:3px}

/* 错误提示 */
.alert{
  display:none;margin-top:16px;padding:10px 12px;border-radius:10px;
  background:#2A1418;border:1px solid rgba(255,95,115,.3);
  font-size:11.5px;line-height:1.55;color:#FFB3BB;
  align-items:flex-start;gap:8px;
}
.alert.show{display:flex;animation:shake .34s}
.alert svg{flex:0 0 auto;margin-top:1px}
@keyframes shake{
  0%,100%{transform:translateX(0)}22%{transform:translateX(-4px)}
  48%{transform:translateX(3px)}72%{transform:translateX(-2px)}
}

/* 提交 */
.submit{
  width:100%;height:46px;margin-top:22px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;gap:9px;
  background:var(--grad);color:#08101A;
  font-size:13px;font-weight:700;letter-spacing:.4px;
  box-shadow:0 12px 28px -14px rgba(53,224,200,.62);
  transition:filter .16s,transform .07s,box-shadow .16s;
}
.submit:hover{filter:brightness(1.06);box-shadow:0 14px 32px -13px rgba(53,224,200,.7)}
.submit:active{transform:translateY(1px)}
.submit[data-state="loading"],.submit[data-state="done"]{cursor:default;filter:none}
.spinner{
  width:14px;height:14px;border-radius:7px;flex:0 0 auto;display:none;
  border:2px solid rgba(8,16,26,.25);border-top-color:#08101A;
  animation:spin .7s linear infinite;
}
.submit[data-state="loading"] .spinner{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* 登录成功 */
.success{
  display:none;margin-top:16px;padding:11px 12px;border-radius:10px;
  background:#12281F;border:1px solid rgba(61,220,151,.3);
  font-size:11.5px;color:#9FE9C6;align-items:center;gap:8px;
}
.success.show{display:flex}
.success a{margin-left:auto;color:var(--ok);font-weight:600;white-space:nowrap}
.success a:hover{text-decoration:underline;text-underline-offset:3px}

/* 或 / 备用入口 */
.or{display:flex;align-items:center;gap:12px;margin:22px 0 14px;font-size:10.5px;color:var(--tx-5)}
.or::before,.or::after{content:"";height:1px;flex:1;background:var(--line-2)}
.alt{
  width:100%;height:42px;border-radius:10px;
  border:1px solid var(--line-3);color:var(--tx-2);font-size:12px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .16s,border-color .16s,color .16s;
}
.alt:hover{background:#171E29;border-color:#39455C;color:var(--tx)}

/* 卡脚 */
.panelfoot{
  margin-top:24px;padding-top:18px;border-top:1px solid var(--line-2);
  text-align:center;font-size:11px;line-height:1.7;color:var(--tx-4);
}
.panelfoot .link{font-size:11px}
.hint{
  margin-top:14px;text-align:center;
  font:10px/1.7 var(--mono);color:#3E4859;letter-spacing:.3px;
}
.hint b{color:var(--tx-4);font-weight:500}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width:1000px){
  .stage{grid-template-columns:1fr}
  .brandside{
    padding:24px 22px 20px;gap:0;justify-content:flex-start;
    border-right:0;border-bottom:1px solid var(--line-2);
  }
  .brandside::before{-webkit-mask-image:radial-gradient(120% 140% at 50% 0%,#000,transparent 70%);
                             mask-image:radial-gradient(120% 140% at 50% 0%,#000,transparent 70%)}
  .deco{width:420px;height:420px;right:-140px;bottom:-190px;opacity:.55}
  .pitch,.feats,.brandfoot{display:none}
  .formside{padding:26px 18px 44px;align-items:start}
  .panel{padding:24px;border-radius:18px;box-shadow:none;max-width:440px}
  .pitch-mobile{display:block}
}
@media (min-width:1001px){ .pitch-mobile{display:none} }
.pitch-mobile{margin:10px 0 0;font-size:11.5px;line-height:1.7;color:var(--tx-4)}
@media (max-width:420px){
  .panel{padding:20px}
  .panel h2{font-size:19px}
  .formside{padding:20px 14px 36px}
}
@media (max-height:720px) and (min-width:1001px){
  .brandside{padding:36px 44px;gap:26px}
  .pitch h1{font-size:31px}
  .feats{gap:11px;margin-top:22px}
  .formside{padding:24px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<main class="stage">

  <!-- ==================== 左：品牌 ==================== -->
  <section class="brandside">

    <svg class="deco" viewBox="0 0 720 720" fill="none" aria-hidden="true">
      <path d="M132 706V382C132 202 236 100 360 100C484 100 588 202 588 382V706"
            stroke="url(#dg)" stroke-width="1.6"/>
      <path d="M148 634V390C148 226 244 128 360 128C476 128 572 226 572 390V634"
            stroke="url(#dg2)" stroke-width="1.2"/>
      <path d="M0 438H720" stroke="#35E0C8" stroke-opacity=".13" stroke-width="1.1"/>
      <circle cx="0" cy="438" r="4" fill="#35E0C8" fill-opacity=".28"/>
      <circle cx="720" cy="438" r="4" fill="#35E0C8" fill-opacity=".28"/>
      <circle cx="360" cy="438" r="2" fill="#35E0C8" fill-opacity=".2"/>
      <defs>
        <linearGradient id="dg" x1="132" y1="100" x2="588" y2="706" gradientUnits="userSpaceOnUse">
          <stop stop-color="#5A7BFF" stop-opacity=".26"/>
          <stop offset="1" stop-color="#35E0C8" stop-opacity=".05"/>
        </linearGradient>
        <linearGradient id="dg2" x1="148" y1="128" x2="572" y2="634" gradientUnits="userSpaceOnUse">
          <stop stop-color="#5A7BFF" stop-opacity=".1"/>
          <stop offset="1" stop-color="#35E0C8" stop-opacity=".03"/>
        </linearGradient>
      </defs>
    </svg>

    <div class="lockup">
      <svg width="30" height="30" viewBox="0 0 72 72" fill="none" aria-hidden="true">
        <path d="M22 57V38C22 26.9 28.3 18.4 36 18.4C43.7 18.4 50 26.9 50 38V57"
              stroke="#5A7BFF" stroke-width="6.6" stroke-linecap="round"/>
        <path d="M10 42H62" stroke="#35E0C8" stroke-width="4.4" stroke-linecap="round"/>
        <circle cx="10" cy="42" r="3.9" fill="#35E0C8"/>
        <circle cx="62" cy="42" r="3.9" fill="#35E0C8"/>
      </svg>
      <span class="wordmark">LUMO</span>
      <span class="divider"></span>
      <span class="cn">隧光</span>
    </div>

    <div class="pitch">
      <h1>让内网服务，<br>出现在<em>该出现的地方</em>。</h1>
      <p>一条隧道，两端点亮。登录后即可管理全部连接：为每台设备建一套配置，端口映射、TLS 与令牌收在同一张表单里，打开开关就开始工作。</p>

      <div class="feats">
        <div class="feat">
          <span class="ic">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
              <path d="M8 1.8V7.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M4.6 4.2A5.2 5.2 0 1 0 11.4 4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </span>
          <div><b>一键启停</b><span>每条配置独立进程，互不干扰，切换只点一次开关</span></div>
        </div>
        <div class="feat">
          <span class="ic">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
              <path d="M2.2 5.4H13.8M2.2 10.6H13.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <circle cx="6" cy="5.4" r="1.7" fill="#151B26" stroke="currentColor" stroke-width="1.4"/>
              <circle cx="10.2" cy="10.6" r="1.7" fill="#151B26" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </span>
          <div><b>配置即表单</b><span>端口映射可视化编辑，保存即时生效，无需重启进程</span></div>
        </div>
        <div class="feat">
          <span class="ic">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
              <path d="M8 2.2L13 4.1V8.2C13 11.1 10.9 13.1 8 14.1C5.1 13.1 3 11.1 3 8.2V4.1L8 2.2Z"
                    stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
              <path d="M6.1 8L7.5 9.4L10 6.7" stroke="currentColor" stroke-width="1.4"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <div><b>令牌与 TLS</b><span>传输加密默认开启，认证令牌只留在本机</span></div>
        </div>
      </div>
    </div>

    <div class="brandfoot">
      <span class="pill"><span class="dot"></span>服务运行中</span>
      <span>v0.1.0</span>
      <span class="sep"></span>
      <span>localhost:7500</span>
      <span class="sep"></span>
      <span>© 2026 LUMO</span>
    </div>

    <!-- 窄屏时用的一行副标题 -->
    <p class="pitch-mobile">
      让内网服务，出现在该出现的地方。
    </p>
  </section>

  <!-- ==================== 右：登录表单 ==================== -->
  <section class="formside">
    <div class="panel">

      <h2>登录</h2>
      <p class="sub">内网穿透服务端</p>

      <form id="loginForm" novalidate>

        <div class="field">
          <label for="acc">账号</label>
          <div class="ctrl">
            <span class="lead">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
                <circle cx="8" cy="5.4" r="2.7" stroke="currentColor" stroke-width="1.4"/>
                <path d="M3 13.4C3.5 11.2 5.5 9.8 8 9.8C10.5 9.8 12.5 11.2 13 13.4"
                      stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </span>
            <input id="acc" name="account" type="text" inputmode="email"
                   placeholder="邮箱或用户名" autocomplete="username" spellcheck="false" autofocus>
          </div>
        </div>

        <div class="field">
          <label for="pwd">密码</label>
          <div class="ctrl has-eye">
            <span class="lead">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
                <rect x="3" y="7.2" width="10" height="6.6" rx="1.8" stroke="currentColor" stroke-width="1.4"/>
                <path d="M5.7 7.2V5.4C5.7 4.1 6.7 3.1 8 3.1C9.3 3.1 10.3 4.1 10.3 5.4V7.2"
                      stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                <circle cx="8" cy="10.5" r="1" fill="currentColor"/>
              </svg>
            </span>
            <input id="pwd" name="password" type="password"
                   placeholder="请输入密码" autocomplete="current-password">
            <button class="eye" id="eye" type="button" aria-pressed="false" aria-label="显示密码">
              <svg class="on" width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M1.6 8C3.4 4.9 5.6 3.4 8 3.4C10.4 3.4 12.6 4.9 14.4 8C12.6 11.1 10.4 12.6 8 12.6C5.6 12.6 3.4 11.1 1.6 8Z"
                      stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                <circle cx="8" cy="8" r="2.1" fill="currentColor"/>
              </svg>
              <svg class="off" width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M2.6 5.5C2 6.2 1.7 7 1.6 8C3.4 11.1 5.6 12.6 8 12.6C9 12.6 10 12.3 10.9 11.7M6.2 3.7C6.8 3.5 7.4 3.4 8 3.4C10.4 3.4 12.6 4.9 14.4 8C14 8.7 13.5 9.3 13 9.8"
                      stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2.6 2.6L13.4 13.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="row">
          <label class="remember">
            <input type="checkbox" id="remember" checked>
            <span class="sw"></span>
            <span>记住这台设备</span>
          </label>
          <a class="link" href="#" id="forgot">忘记密码？</a>
        </div>

        <div class="alert" id="alert" role="alert" aria-live="polite">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="6.4" stroke="#FF5F73" stroke-width="1.4"/>
            <path d="M8 4.9V8.7" stroke="#FF5F73" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="8" cy="11.1" r=".95" fill="#FF5F73"/>
          </svg>
          <span id="alertText">账号或密码不正确</span>
        </div>

        <div class="success" id="success">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="6.4" stroke="#3DDC97" stroke-width="1.4"/>
            <path d="M5.2 8.2L7.1 10.1L10.8 6.2" stroke="#3DDC97" stroke-width="1.6"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>验证通过</span>
          <a href="/">进入控制台 →</a>
        </div>

        <button class="submit" id="submit" type="submit" data-state="idle">
          <span class="spinner" aria-hidden="true"></span>
          <span class="label" id="submitLabel">登录</span>
        </button>

      </form>

      <div class="or">或</div>

      <button class="alt" id="tokenBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <circle cx="5.6" cy="10.4" r="2.6" stroke="currentColor" stroke-width="1.4"/>
          <path d="M7.5 8.5L12.6 3.4M10.6 5.4L12.2 7M12 4L13.6 5.6" stroke="currentColor"
                stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        使用访问令牌登录
      </button>

      <div class="panelfoot">
        还没有账号？<a class="link" href="#" id="askAdmin">联系管理员开通</a>
      </div>

    </div>
  </section>

</main>

<script>
(function () {
  'use strict';

  var form    = document.getElementById('loginForm');
  var acc     = document.getElementById('acc');
  var pwd     = document.getElementById('pwd');
  var eye     = document.getElementById('eye');
  var alertEl = document.getElementById('alert');
  var alertTx = document.getElementById('alertText');
  var success = document.getElementById('success');
  var submit  = document.getElementById('submit');
  var label   = document.getElementById('submitLabel');

  function showError(msg) {
    alertTx.textContent = msg;
    alertEl.classList.remove('show');
    void alertEl.offsetWidth;        /* 重排一次，让抖动动画重新播放 */
    alertEl.classList.add('show');
    success.classList.remove('show');
  }

  function clearError() {
    alertEl.classList.remove('show');
  }

  function setState(s) {
    submit.dataset.state = s;
    submit.disabled = (s !== 'idle');
    label.textContent = s === 'loading' ? '正在验证…' : s === 'done' ? '已登录' : '登录';
  }

  /* ---------- 密码可见性 ---------- */
  eye.addEventListener('click', function () {
    var show = eye.getAttribute('aria-pressed') !== 'true';
    eye.setAttribute('aria-pressed', String(show));
    eye.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
    pwd.type = show ? 'text' : 'password';
    pwd.focus();
  });

  /* ---------- 提交 ---------- */
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (submit.dataset.state !== 'idle') return;

    var account = acc.value.trim();
    var pass    = pwd.value;

    if (!account) {
      showError('请输入账号，可以是邮箱或用户名');
      acc.focus();
      return;
    }
    if (account.indexOf('@') > -1 && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(account)) {
      showError('邮箱格式看起来不对，请检查 @ 前后的内容');
      acc.focus();
      return;
    }
    if (!pass) {
      showError('请输入密码');
      pwd.focus();
      return;
    }
    if (pass.length < 6) {
      showError('密码至少 6 位');
      pwd.focus();
      return;
    }

    clearError();
    setState('loading');

    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ account: account, password: pass })
    })
      .then(function (r) {
        return r.json().then(function (d) { return { ok: r.ok, d: d }; });
      })
      .then(function (res) {
        if (res.ok) {
          try {
            if (document.getElementById('remember').checked) {
              localStorage.setItem('lumo.remember', account);
            } else {
              localStorage.removeItem('lumo.remember');
            }
          } catch (_) {}
          setState('done');
          success.classList.add('show');
          setTimeout(function () { location.href = '/'; }, 350);
        } else {
          setState('idle');
          showError((res.d && res.d.error) || '账号或密码不正确。连续 5 次失败会锁定 10 分钟');
          pwd.select();
        }
      })
      .catch(function () {
        setState('idle');
        showError('无法连接本地服务，请确认进程正在运行');
      });
  });

  /* 输入时清掉错误，避免一直挂着红条 */
  [acc, pwd].forEach(function (el) {
    el.addEventListener('input', clearError);
  });

  /* 回填上次记住的账号 */
  try {
    var saved = localStorage.getItem('lumo.remember');
    if (saved) {
      acc.value = saved;
      pwd.focus();
    }
  } catch (_) {}

  /* 占位入口，避免点击无反应 */
  ['forgot', 'askAdmin', 'tokenBtn'].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('click', function (e) {
      e.preventDefault();
      showError(
        id === 'forgot'   ? '密码重置需要管理员在服务端执行，或使用访问令牌登录' :
        id === 'askAdmin' ? '请让管理员在「服务配置 → 账号」里为你创建账号' :
                            '访问令牌登录：粘贴服务端生成的 token 即可，无需密码'
      );
    });
  });
})();
</script>
</body>
</html>
